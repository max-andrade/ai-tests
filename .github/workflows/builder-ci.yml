name: builder-ci

on:
  pull_request:
  push:
    branches:
      - work
      - main

jobs:
  verify-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify builder
        run: ./builder/scripts/verify_builder.sh
